[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-local"
version = "0.1.0"
description = "Multi-provider AI coding assistant with local LLM and cloud API support"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.61.0",
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "ollama>=0.2.1",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "google-genai>=1.0.0",
    "duckduckgo-search>=6.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
all-apis = [
    "mistralai>=1.0.0",
    "groq>=0.9.0",
    "cohere>=5.5.0",
    "together>=1.2.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
]

[project.scripts]
antigravity = "ag.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ag*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
